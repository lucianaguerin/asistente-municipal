<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Asistente de Permisos Municipales</title>
    <!-- Esta línea es la que hace la magia del diseño -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Barra superior -->
    <nav class="navbar navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'index' %}">🏛️ Asistente Municipal</a>
        </div>
    </nav>

    <!-- Contenedor del cuestionario -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow p-4">
                    <h2 class="text-center mb-3">Trámites y Patentes</h2>
                    <p class="text-muted text-center mb-4">Selecciona tu comuna y rubro para ver los permisos que necesitas.</p>

                    <form method="GET" action="{% url 'resultado_permisos' %}">
    
                        <!-- 1. Comuna -->
                        <div class="mb-3">
                            <label for="comuna" class="form-label"><b>1. ¿En qué comuna vas a emprender?</b></label>
                            <select name="comuna" id="comuna" class="form-control" required>
                                <option value="" disabled selected>Selecciona tu comuna...</option>
                                <option value="Valparaíso">Valparaíso</option>
                                <option value="Viña del Mar">Viña del Mar</option>
                            </select>
                        </div>
                    
                        <!-- 2. Actividad -->
                        <div class="mb-3">
                            <label for="actividad" class="form-label"><b>2. ¿Qué tipo de actividad principal realizarás?</b></label>
                            <select name="actividad" id="actividad" class="form-control" required>
                                <option value="" disabled selected>Selecciona tu rubro...</option>
                                <option value="Gastronomía y Alimentos">Gastronomía y Alimentos</option>
                                <option value="Servicios Profesionales">Servicios Profesionales</option>
                                <option value="Comercio">Comercio Minorista / Vía Pública</option>
                            </select>
                        </div>
                    
                        <!-- 3. Espacio -->
                        <div class="mb-3">
                            <label for="espacio" class="form-label"><b>3. ¿Dónde vas a operar?</b></label>
                            <select name="espacio" id="espacio" class="form-control" required>
                                <option value="" disabled selected>Selecciona el espacio...</option>
                                <option value="local">En un local o propiedad comercial</option>
                                <option value="calle">En la vía pública o ambulante</option>
                            </select>
                        </div>
                    
                        <button type="submit" class="btn btn-primary w-100 mt-3">Diagnosticar mis permisos</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
