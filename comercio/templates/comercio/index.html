<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Asistente de Permisos Municipales</title>
    <!-- Esta línea es la que hace la magia del diseño -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Barra superior -->
    <nav class="navbar navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'index' %}">🏛️ Asistente Municipal</a>
        </div>
    </nav>

    <!-- Contenedor del cuestionario -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow p-4">
                    <h2 class="text-center mb-3">Trámites y Patentes</h2>
                    <p class="text-muted text-center mb-4">Selecciona tu comuna y rubro para ver los permisos que necesitas.</p>

                    <form action="{% url 'resultado_permisos' %}" method="GET">
                        
                        <div class="mb-3">
                            <label for="comuna" class="form-label fw-bold">Comuna:</label>
                            <select name="comuna" id="comuna" class="form-select">
                                <option value="">Todas las comunas</option>
                                <option value="Valparaíso">Valparaíso</option>
                                <option value="Viña del Mar">Viña del Mar</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="rubro" class="form-label fw-bold">Rubro:</label>
                            <select name="rubro" id="rubro" class="form-select">
                                <option value="">Todos los rubros</option>
                                <option value="Gastronomía y Alimentos">Gastronomía y Alimentos</option>
                                <option value="Comercio Minorista">Comercio Minorista</option>
                                <option value="Comercio en Vía Pública">Comercio en Vía Pública</option>
                                <option value="Servicios Profesionales">Servicios Profesionales</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Buscar permisos</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
